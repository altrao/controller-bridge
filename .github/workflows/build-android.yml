name: Build Android APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This project has no Gradle wrapper committed (no gradlew, no gradle/wrapper/),
      # so a Gradle distribution has to be supplied from outside. Pinned to 8.7 because
      # AGP 8.5.2 refuses to run on anything older.
      #
      # If you add a wrapper later, drop this step and use ./gradlew instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Deliberately NOT using android-actions/setup-android here. The ubuntu-latest
      # image already ships the Android SDK plus cmdline-tools, and the action's own
      # internal sdkmanager invocation fails against the image's cmdline-tools 16.0
      # with "Failed to find package 'tools'". Removing it drops a third-party
      # failure point and costs nothing.
      #
      # sdkmanager is located rather than hardcoded because the image ships a
      # version-numbered directory (cmdline-tools/16.0) and there is no "latest"
      # symlink. sort -V picks the newest if more than one is present.
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version

          # Accept licenses. The `|| true` is required, not defensive: Actions runs
          # bash with -o pipefail, so `yes` dying of SIGPIPE (exit 141) would fail
          # the step even when sdkmanager succeeded.
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true

          # This call is NOT wrapped in `|| true` -- if it fails we want the job red.
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      # assembleDebug, not assembleRelease: app/build.gradle.kts declares no signing
      # config, so a release build produces app-release-unsigned.apk, which Android
      # refuses to install. The debug build is signed with the auto-generated debug
      # keystore and is installable as-is, with no secrets.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: List APK outputs
        if: always()
        run: |
          find app/build/outputs -type f -name '*.apk' -printf '%p  %s bytes\n' || true

      - uses: actions/upload-artifact@v4
        with:
          name: ControllerBridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
